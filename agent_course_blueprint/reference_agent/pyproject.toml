[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-course"
version = "0.1.0"
description = "Agent Engineering course reference implementation"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pytest>=7.0",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
